app:
  name: nodejs-hello-api
replicaCount: 2
image:
  repository: alx52/nodejs-hello-api
  tag: "0.0.4"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3000
configMap:
  PORT: "3000"
  LOG_LEVEL: "info"
  AWS_REGION: us-east-1
  AWS_SQS_QUEUE_NAME: /000000000000/minha-fila
  AWS_ENDPOINT_URL: "http://localhost:4566"
